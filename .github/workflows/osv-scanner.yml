# OSV-Scanner — corrected fleet version (Oct 23, 2026)
# Replaces the v1.7.1 reusable-workflow pin, whose internal
# actions/upload-artifact@v3.1.3 was retired Jan 30, 2025 and fails
# every PR/merge_group run at artifact upload.
# Upstream v2.7.0 reusables SHA-pin actions/upload-artifact v7.0.1 and
# github/codeql-action/upload-sarif v4.38.0 internally.
# Structure follows the current upstream samples
# (https://google.github.io/osv-scanner/github-action/): no scan-args
# override — v2 defaults are "-r ./". SARIF upload stays on (default);
# both target repos are public, so code scanning upload is free.
# If a SARIF step ever fails on a repo without code scanning enabled,
# add `with: upload-sarif: false` to both jobs.

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '45 6 * * 6'
  push:
    branches: [ "main" ]

permissions:
  # Required to upload SARIF file to CodeQL
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0"
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0"
